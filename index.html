        peopleList:[["বঙ্গবন্ধু শেখ মুজিবুর রহমান","রাষ্ট্রনায়ক","স্বাধীন বাংলাদেশের স্থপতি ও মুক্তিসংগ্রামের প্রধান নেতা; ১৯৭১ সালে রাষ্ট্রের স্বাধীনতার ডাক দেন।","photo-1560250097-0b93528c311a"],["বেগম রোকেয়া","লেখক ও সমাজসংস্কারক","নারীশিক্ষা ও অধিকার আন্দোলনের অগ্রদূত; ‘সুলতানার স্বপ্ন’ তাঁর বহুলপঠিত রচনা।","photo-1580489944761-15a19d654956"],["কাজী নজরুল ইসলাম","কবি ও সংগীতজ্ঞ","‘বিদ্রোহী কবি’ নামে পরিচিত; তাঁর কবিতা, গান ও সাহিত্য বাংলা সংস্কৃতিকে সমৃদ্ধ করেছে।","photo-1506794778202-cad84cf45f1d"],["ড. মুহাম্মদ ইউনূস","অর্থনীতিবিদ","ক্ষুদ্রঋণ ও সামাজিক ব্যবসার ধারণার জন্য ২০০৬ সালে গ্রামীণ ব্যাংকের সঙ্গে নোবেল শান্তি পুরস্কার পান।","photo-1560250097-0b93528c311a"],["জগদীশচন্দ্র বসু","বিজ্ঞানী","অবিভক্ত বাংলায় জন্ম নেওয়া এই বিজ্ঞানী বেতার তরঙ্গ ও উদ্ভিদ-শারীরবিদ্যায় পথিকৃৎ গবেষণার জন্য স্মরণীয়।","photo-1500648767791-00dcc994a43e"],["জয়নুল আবেদিন","চিত্রশিল্পী","বাংলাদেশের আধুনিক শিল্পকলার পথিকৃৎ; ১৯৪৩ সালের দুর্ভিক্ষের স্কেচমালার জন্য বিশেষভাবে পরিচিত।","photo-1506794778202-cad84cf45f1d"],["সাকিব আল হাসান","ক্রিকেটার","বাংলাদেশের অন্যতম সফল অলরাউন্ডার; আন্তর্জাতিক ক্রিকেটে দীর্ঘদিন গুরুত্বপূর্ণ অবদান রেখেছেন।","photo-1531415074968-036ba1b575da"],["ফিরদৌসী কাদরী","বিজ্ঞানী","বাংলাদেশি রোগপ্রতিরোধবিদ; কলেরা ও টাইফয়েডের টিকা-গবেষণায় অবদানের জন্য ২০২১ সালে র‍্যামন ম্যাগসেসে পুরস্কার পান।","photo-1551836022-d5d88e9218df"]],
        faq:{kicker:"সাধারণ জিজ্ঞাসা",title:"বাংলাদেশ নিয়ে <span class='gradient-text'>আপনার প্রশ্ন</span>",desc:"দেশটি সম্পর্কে জানতে আগ্রহী? কয়েকটি সংক্ষিপ্ত উত্তরে শুরু হোক পরিচয়।"},
        faqList:[["বাংলাদেশের রাজধানী কোথায়?","বাংলাদেশের রাজধানী ঢাকা—দেশের বৃহত্তম শহর এবং প্রশাসন, বাণিজ্য ও সংস্কৃতির প্রধান কেন্দ্র।"],["বাংলাদেশের স্বাধীনতা দিবস কবে?","২৬ মার্চ স্বাধীনতা দিবস। ১৯৭১ সালের ১৬ ডিসেম্বর মুক্তিযুদ্ধে বিজয়ের মধ্য দিয়ে স্বাধীনতা অর্জিত হয়।"],["বাংলাদেশে কোন ভাষায় কথা বলা হয়?","বাংলা রাষ্ট্রভাষা। বিভিন্ন ক্ষুদ্র জাতিগোষ্ঠীর নিজস্ব ভাষাও রয়েছে; ইংরেজি শিক্ষা ও পেশাগত ক্ষেত্রেও ব্যবহৃত হয়।"],["বাংলাদেশ ভ্রমণের ভালো সময় কোনটি?","সাধারণত শীতকাল (নভেম্বর–ফেব্রুয়ারি) আরামদায়ক আবহাওয়ার জন্য জনপ্রিয়। বর্ষায় প্রকৃতি সবুজ হয়, তবে বৃষ্টি ও বন্যার পূর্বাভাস দেখে ভ্রমণ পরিকল্পনা করা ভালো।"],["কোন মুদ্রা ব্যবহার হয়?","বাংলাদেশের মুদ্রা টাকা; আন্তর্জাতিক কোড BDT এবং প্রতীক ৳।"],["বাংলাদেশের বিখ্যাত প্রাকৃতিক স্থান কী কী?","সুন্দরবন, কক্সবাজার, সেন্ট মার্টিন, সিলেটের চা-বাগান, হাওর এবং পার্বত্য চট্টগ্রাম বিশেষভাবে পরিচিত।"]],

        placesList:[["Cox's Bazar","Coast","Among the world's longest natural sandy beaches, celebrated for its waves, sunsets, and coastal life.","photo-1519046904884-53103b34b206"],["The Sundarbans","Wildlife","A UNESCO World Heritage mangrove forest. River journeys reveal distinctive wildlife and forest landscapes.","photo-1516026672322-bc52d61a55d5"],["Saint Martin's Island","Island","Bangladesh's only coral-rich island, known for clear blue water and a fragile reef ecosystem.","photo-1500375592092-40eb2168fd21"],["Sajek","Hills","A hill settlement in Rangamati, popular for its cloud-wrapped valleys and the hospitality of local communities.","photo-1464822759023-fed622ff2c3b"],["Bandarban","Hills","Chimbuk, Nilgiri, and mountain rivers make this a region of striking scenery and diverse Indigenous cultures.","photo-1500530855697-b586d89ba3ee"],["Rangamati","Lake","The blue waters of Kaptai Lake, hill islands, and boat trips make for a memorable visit.","photo-1470770841072-f978cf4d019e"],["Sylhet","Tea country","Green tea estates, Jaflong, and the Ratargul swamp forest make Sylhet a favourite for nature lovers.","photo-1511497584788-876760111969"],["Kuakata","Coast","A beach in Patuakhali where both sunrise and sunset can be seen over the same coastline.","photo-1507525428034-b723cf961d3e"],["Paharpur","Heritage","The ruins of Somapura Mahavihara, an ancient Buddhist monastery and UNESCO World Heritage Site.","photo-1564399579883-451a5d44ec08"]],
        culture:{kicker:"Culture & heritage",title:"The colours of <span class='gradient-text'>Bengal's spirit</span>",desc:"Bangla, folk arts, hospitality, and seasonal celebrations make Bengali culture vibrant and many-layered."},
        cultureList:[["🎨","Folk art & crafts","Nakshi kantha, jamdani, pottery, and bamboo crafts live on through generations."],["🎉","Pohela Boishakh","The Bengali New Year is welcomed with processions, fairs, music, and traditional food."],["🎶","Music & dance","Baul, bhatiali, bhawaiya, and Rabindra Sangeet enrich Bengal's musical traditions."],["🪔","Many celebrations","Eid, Durga Puja, Buddha Purnima, Christmas, and other religious and social festivals are celebrated."],["👘","Traditional dress","Sarees, panjabis, lungis, and salwar kameez are common everyday and festive attire."],["🧵","Jamdani","A finely woven textile tradition of Dhaka, recognized by UNESCO as intangible cultural heritage."],["📚","The value of language","The history of the struggle for mother-tongue rights is central to Bengali identity and cultural consciousness."],["🤝","Hospitality","Welcoming guests, sharing meals, and supporting neighbours are valued parts of social life."]],
        food:{kicker:"Food & cuisine",title:"The taste of Bengal, <span class='gradient-text'>rice and rivers</span>",desc:"Seasonal produce, river fish, spices, and sweets give Bangladeshi cuisine a distinctive regional variety."},
        foodList:[["Steamed hilsa","The national fish hilsa, steamed with mustard and green chilli, is a much-loved dish.","photo-1510130387422-82bed34b37e9"],["Biryani","Fragrant rice-and-meat dishes such as kacchi and tehari are favourites for celebrations and gatherings.","photo-1563379091339-03246963d96c"],["Pitha","Winter bhapa, patishapta, and chitoi pitha bring the sweet flavours of rice flour and date molasses.","photo-1601050690597-df0568f70950"],["Sweets","Rasgulla, sandesh, chomchom, and doi each have regional traditions and devoted fans.","photo-1551024506-0bccd828d307"],["Rice & lentils","A familiar foundation of daily meals, often served with vegetables, bhorta, or fish.","photo-1512058564366-18510be2db19"],["Fuchka & chotpoti","Popular street foods of tangy spice, chickpeas, and crisp-filled shells.","photo-1601050690117-94f5f6fa8bd7"],["Prawns","In coastal kitchens, prawns are prepared with coconut, spices, and local ingredients.","photo-1625944525533-473f1a3d54e7"],["Kala bhuna","A spiced beef dish from Chattogram, slowly cooked until richly browned.","photo-1544025162-d76694265947"]],

    const imgUrl=(id,w=700)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;
    let lang=localStorage.getItem("bd-site-language")||"bn";
    function val(path){return path.split(".").reduce((o,k)=>o&&o[k],T[lang]);}
    function translateStatic(){document.querySelectorAll("[data-i18n]").forEach(el=>{const s=val(el.dataset.i18n);if(s!==undefined)el.textContent=s});document.querySelectorAll("[data-i18n-html]").forEach(el=>{const s=val(el.dataset.i18nHtml);if(s!==undefined)el.innerHTML=s});document.querySelectorAll("[data-i18n-alt]").forEach(el=>{const s=val(el.dataset.i18nAlt);if(s!==undefined)el.alt=s});}
    function render(){
      document.documentElement.lang=lang;document.body.classList.toggle("en",lang==="en");document.title=lang==="bn"?"বাংলাদেশ — নদী, মানুষ, সম্ভাবনা":"Bangladesh — Rivers, People, Possibility";
      document.querySelector('meta[name="description"]').content=lang==="bn"?T.bn.about.desc:T.en.about.desc;
      translateStatic();
      document.getElementById("langToggle").textContent=lang==="bn"?"EN":"বাংলা";
      document.getElementById("footerLang").textContent=lang==="bn"?"Switch to English":"বাংলায় দেখুন";
      document.getElementById("factGrid").innerHTML=T[lang].facts.map(([a,b])=>`<div class="fact"><span class="fact-label">${a}</span><strong>${b}</strong></div>`).join("");
      document.getElementById("timeline").innerHTML=T[lang].timeline.map(([year,title,desc])=>`<article class="time-card"><span class="year">${year}</span><h3>${title}</h3><p>${desc}</p></article>`).join("");
      document.getElementById("natureFacts").innerHTML=T[lang].natureFacts.map(([icon,title,desc])=>`<article class="culture-card"><span class="culture-icon">${icon}</span><h3>${title}</h3><p>${desc}</p></article>`).join("");
      document.getElementById("divisionList").innerHTML=T[lang].divisions.map((d,i)=>`<button class="division-btn${i===0?" active":""}" data-division="${i}">${lang==="bn"?d.name:d.en}</button>`).join("");
      document.querySelectorAll(".division-btn").forEach(btn=>btn.addEventListener("click",()=>showDivision(Number(btn.dataset.division))));
      showDivision(0);
      document.getElementById("placesGrid").innerHTML=T[lang].placesList.map(([name,tag,desc,img])=>`<article class="place"><div class="place-image"><img loading="lazy" src="${imgUrl(img)}" alt="${name}"><span class="place-badge">${tag}</span></div><div class="place-content"><h3>${name}</h3><p>${desc}</p></div></article>`).join("");
      document.getElementById("cultureGrid").innerHTML=T[lang].cultureList.map(([icon,title,desc])=>`<article class="culture-card"><span class="culture-icon">${icon}</span><h3>${title}</h3><p>${desc}</p></article>`).join("");
      document.getElementById("foodGrid").innerHTML=T[lang].foodList.map(([title,desc,img])=>`<article class="food-card"><img loading="lazy" src="${imgUrl(img,600)}" alt="${title}"><div><h3>${title}</h3><p>${desc}</p></div></article>`).join("");
      document.getElementById("economyStats").innerHTML=T[lang].economyStats.map(([a,b])=>`<div class="stat-box"><strong>${a}</strong><span>${b}</span></div>`).join("");
      document.getElementById("economyChart").innerHTML=`<h3>${T[lang].economyChart.title}</h3>${T[lang].economyChart.rows.map(([label,n])=>`<div class="bar"><div class="bar-label"><span>${label}</span><span>${n}/100</span></div><div class="bar-track"><div class="bar-fill" style="width:${n}%"></div></div></div>`).join("")}`;
      document.getElementById("learningGrid").innerHTML=T[lang].learningList.map(([icon,title,desc])=>`<article class="learning-card"><div class="emoji">${icon}</div><h3>${title}</h3><p>${desc}</p></article>`).join("");
      document.getElementById("lifeList").innerHTML=T[lang].lifeList.map(([title,desc],i)=>`<article class="life-item"><span class="life-num">${i+1}</span><div><b>${title}</b><p>${desc}</p></div></article>`).join("");
      document.getElementById("symbolsGrid").innerHTML=T[lang].symbolsList.map(([icon,label,value])=>`<article class="symbol"><span class="emoji">${icon}</span><span>${label}</span><strong>${value}</strong></article>`).join("");
      document.getElementById("peopleGrid").innerHTML=T[lang].peopleList.map(([name,role,desc,img])=>`<article class="person"><img loading="lazy" src="${imgUrl(img,500)}" alt="${lang==="bn"?"প্রতীকী ছবি: ":"Illustrative photo for "}${name}"><div><h3>${name}</h3><small>${role}</small><p>${desc}</p></div></article>`).join("");
      document.getElementById("faqList").innerHTML=T[lang].faqList.map(([q,a])=>`<article class="faq-item"><button class="faq-question"><span>${q}</span><span>+</span></button><div class="faq-answer">${a}</div></article>`).join("");
      document.querySelectorAll(".faq-question").forEach(b=>b.addEventListener("click",()=>b.parentElement.classList.toggle("open")));
      document.querySelectorAll(".reveal").forEach(el=>{el.classList.remove("visible");observer.observe(el)});
      document.getElementById("menuBtn").setAttribute("aria-label",lang==="bn"?"মেনু খুলুন":"Open menu");
      document.querySelector(".brand").setAttribute("aria-label",lang==="bn"?"বাংলাদেশ, প্রধান পাতা":"Bangladesh, home");
    }
    const districtNamesEn={"ঢাকা":"Dhaka","গাজীপুর":"Gazipur","নারায়ণগঞ্জ":"Narayanganj","নরসিংদী":"Narsingdi","মানিকগঞ্জ":"Manikganj","মুন্সিগঞ্জ":"Munshiganj","টাঙ্গাইল":"Tangail","কিশোরগঞ্জ":"Kishoreganj","ফরিদপুর":"Faridpur","গোপালগঞ্জ":"Gopalganj","মাদারীপুর":"Madaripur","রাজবাড়ী":"Rajbari","শরীয়তপুর":"Shariatpur","চট্টগ্রাম":"Chattogram","কক্সবাজার":"Cox's Bazar","কুমিল্লা":"Cumilla","ফেনী":"Feni","নোয়াখালী":"Noakhali","লক্ষ্মীপুর":"Lakshmipur","চাঁদপুর":"Chandpur","ব্রাহ্মণবাড়িয়া":"Brahmanbaria","খাগড়াছড়ি":"Khagrachhari","রাঙামাটি":"Rangamati","বান্দরবান":"Bandarban","রাজশাহী":"Rajshahi","চাঁপাইনবাবগঞ্জ":"Chapainawabganj","নওগাঁ":"Naogaon","নাটোর":"Natore","পাবনা":"Pabna","সিরাজগঞ্জ":"Sirajganj","বগুড়া":"Bogura","জয়পুরহাট":"Joypurhat","খুলনা":"Khulna","বাগেরহাট":"Bagerhat","সাতক্ষীরা":"Satkhira","যশোর":"Jashore","ঝিনাইদহ":"Jhenaidah","মাগুরা":"Magura","নড়াইল":"Narail","কুষ্টিয়া":"Kushtia","চুয়াডাঙ্গা":"Chuadanga","মেহেরপুর":"Meherpur","বরিশাল":"Barishal","পটুয়াখালী":"Patuakhali","ভোলা":"Bhola","পিরোজপুর":"Pirojpur","বরগুনা":"Barguna","ঝালকাঠি":"Jhalokati","সিলেট":"Sylhet","মৌলভীবাজার":"Moulvibazar","হবিগঞ্জ":"Habiganj","সুনামগঞ্জ":"Sunamganj","রংপুর":"Rangpur","দিনাজপুর":"Dinajpur","কুড়িগ্রাম":"Kurigram","গাইবান্ধা":"Gaibandha","নীলফামারী":"Nilphamari","লালমনিরহাট":"Lalmonirhat","ঠাকুরগাঁও":"Thakurgaon","পঞ্চগড়":"Panchagarh","ময়মনসিংহ":"Mymensingh","জামালপুর":"Jamalpur","নেত্রকোণা":"Netrokona","শেরপুর":"Sherpur"};
    function showDivision(i){const d=T[lang].divisions[i];if(!d)return;document.querySelectorAll(".division-btn").forEach(b=>b.classList.toggle("active",Number(b.dataset.division)===i));const name=lang==="bn"?d.name:d.en;const districts=d.districts.split(", ").map(n=>lang==="bn"?n:(districtNamesEn[n]||n));const positions=[[39,19],[38,47],[24,42],[30,70],[48,79],[75,35],[22,19],[57,33]];const pins=positions.map(([x,y],n)=>`<button class="map-pin${n===i?" active":""}" style="left:${x}%;top:${y}%" data-map-division="${n}" aria-label="${lang==="bn"?T[lang].divisions[n].name:T[lang].divisions[n].en}">${n+1}</button>`).join("");document.getElementById("districtPanel").innerHTML=`<div class="map-schematic" role="group" aria-label="${lang==="bn"?"বাংলাদেশের বিভাগভিত্তিক চিত্রমানচিত্র":"Schematic map of Bangladesh's divisions"}"><svg viewBox="0 0 200 240" aria-hidden="true"><path class="map-shape" d="M75 5 113 12 141 31 130 47 148 63 137 78 151 94 140 111 153 126 143 143 151 159 137 177 130 195 113 223 97 211 87 191 70 185 63 164 53 150 48 132 38 114 47 97 39 82 52 67 49 51 65 43 70 26Z"/><path class="map-river" d="M64 49Q88 67 125 73M48 99Q85 92 139 108M61 151Q90 135 143 143M75 175Q99 164 133 178"/></svg>${pins}</div><p class="map-caption">${lang==="bn"?"বিভাগ নির্বাচন করতে মানচিত্রের নম্বরে চাপ দিন • আনুমানিক চিত্র":"Select a division on the map • schematic, not to scale"}</p><h3>${name} ${lang==="bn"?"বিভাগ":"Division"}</h3><p>${d.info}</p><div class="district-tags">${districts.map(n=>`<span>${n}</span>`).join("")}</div><p class="map-note">${lang==="bn"?"জেলা তালিকা বিভাগভিত্তিক সরকারি প্রশাসনিক বিন্যাস অনুসরণ করে।":"Districts are listed by Bangladesh's official administrative divisions."}</p>`;document.querySelectorAll("[data-map-division]").forEach(b=>b.addEventListener("click",()=>showDivision(Number(b.dataset.mapDivision))));}
    const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");observer.unobserve(e.target)}}),{threshold:.08});
    function setLanguage(next){lang=next;localStorage.setItem("bd-site-language",lang);render()}
    document.getElementById("langToggle").addEventListener("click",()=>setLanguage(lang==="bn"?"en":"bn"));
    document.getElementById("footerLang").addEventListener("click",()=>setLanguage(lang==="bn"?"en":"bn"));
    const menuBtn=document.getElementById("menuBtn"),navLinks=document.getElementById("navLinks");
    menuBtn.addEventListener("click",()=>{const open=navLinks.classList.toggle("open");menuBtn.setAttribute("aria-expanded",String(open));menuBtn.textContent=open?"×":"☰"});
    navLinks.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{navLinks.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");menuBtn.textContent="☰"}));
    const topBtn=document.getElementById("topBtn");
    window.addEventListener("scroll",()=>{const max=document.documentElement.scrollHeight-innerHeight;document.getElementById("progress").style.width=(max>0?scrollY/max*100:0)+"%";topBtn.classList.toggle("show",scrollY>600)},{passive:true});
    topBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
    render();
  </script>
